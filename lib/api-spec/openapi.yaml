openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart Medicine Inventory Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard statistics and activity
  - name: medicines
    description: Medicine inventory
  - name: checkout
    description: Medicine dispensing cart
  - name: feedback
    description: Feedback and questions
  - name: reports
    description: Inventory reports
  - name: auth
    description: Application profile
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentProfile
      tags: [auth]
      summary: Get the signed-in user's application role
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Sign-in required
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get live inventory statistics
      responses:
        "200":
          description: Current inventory totals and alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/trends:
    get:
      operationId: getDashboardTrends
      tags: [dashboard]
      summary: Get recent inventory movement trend
      responses:
        "200":
          description: Monthly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"
  /activities:
    get:
      operationId: listActivities
      tags: [dashboard]
      summary: List recent inventory activity
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /medicines:
    get:
      operationId: listMedicines
      tags: [medicines]
      summary: Search and filter medicines
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [all, low-stock, expiring, expired]
      responses:
        "200":
          description: Matching medicines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medicine"
    post:
      operationId: createMedicine
      tags: [medicines]
      summary: Add a medicine to inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineInput"
      responses:
        "201":
          description: Medicine created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
  /medicines/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      operationId: getMedicine
      tags: [medicines]
      summary: Get one medicine
      responses:
        "200":
          description: Medicine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
        "404":
          description: Medicine not found
    patch:
      operationId: updateMedicine
      tags: [medicines]
      summary: Update a medicine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineUpdate"
      responses:
        "200":
          description: Updated medicine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
    delete:
      operationId: deleteMedicine
      tags: [medicines]
      summary: Remove a medicine
      responses:
        "204":
          description: Medicine removed
        "404":
          description: Medicine not found
  /checkout:
    post:
      operationId: checkoutCart
      tags: [checkout]
      summary: Confirm a medicine cart and decrement stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Checkout completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "409":
          description: Insufficient stock
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List submitted feedback
      responses:
        "200":
          description: Feedback records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit a rating and comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
  /faqs:
    get:
      operationId: listFaqs
      tags: [feedback]
      summary: List common questions
      responses:
        "200":
          description: Frequently asked questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faq"
  /questions:
    post:
      operationId: submitQuestion
      tags: [feedback]
      summary: Send a question to the inventory team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Question received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
  /reports/stock:
    get:
      operationId: getStockReport
      tags: [reports]
      summary: Get a full stock and expiry report
      responses:
        "200":
          description: Current stock report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReport"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [admin, staff]
        isFirstAdmin:
          type: boolean
      required: [userId, role, isFirstAdmin]
    Medicine:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: ["string", "null"] }
        batchNumber: { type: ["string", "null"] }
        quantity: { type: integer }
        unitPrice: { type: number }
        expiryDate: { type: string, format: date }
        supplier: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, quantity, unitPrice, expiryDate, createdAt, updatedAt]
    MedicineInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: ["string", "null"] }
        batchNumber: { type: ["string", "null"] }
        quantity: { type: integer, minimum: 0 }
        unitPrice: { type: number, minimum: 0 }
        expiryDate: { type: string, format: date }
        supplier: { type: ["string", "null"] }
      required: [name, quantity, unitPrice, expiryDate]
    MedicineUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: ["string", "null"] }
        batchNumber: { type: ["string", "null"] }
        quantity: { type: integer, minimum: 0 }
        unitPrice: { type: number, minimum: 0 }
        expiryDate: { type: string, format: date }
        supplier: { type: ["string", "null"] }
    DashboardSummary:
      type: object
      properties:
        medicineTypes: { type: integer }
        totalUnits: { type: integer }
        lowStockCount: { type: integer }
        expiringSoonCount: { type: integer }
        expiredCount: { type: integer }
        inventoryValue: { type: number }
      required: [medicineTypes, totalUnits, lowStockCount, expiringSoonCount, expiredCount, inventoryValue]
    TrendPoint:
      type: object
      properties:
        month: { type: string }
        stockIn: { type: integer }
        stockOut: { type: integer }
      required: [month, stockIn, stockOut]
    Activity:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        details: { type: string }
        medicineName: { type: ["string", "null"] }
        quantity: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, action, details, createdAt]
    CheckoutInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutLineInput"
      required: [items]
    CheckoutLineInput:
      type: object
      properties:
        medicineId: { type: integer }
        quantity: { type: integer, minimum: 1 }
      required: [medicineId, quantity]
    CheckoutLine:
      type: object
      properties:
        medicineId: { type: integer }
        medicineName: { type: string }
        quantity: { type: integer }
        lineTotal: { type: number }
      required: [medicineId, medicineName, quantity, lineTotal]
    CheckoutResult:
      type: object
      properties:
        total: { type: number }
        completedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutLine"
      required: [total, completedAt, items]
    Feedback:
      type: object
      properties:
        id: { type: integer }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, rating, comment, createdAt]
    FeedbackInput:
      type: object
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 1 }
      required: [rating, comment]
    Faq:
      type: object
      properties:
        id: { type: integer }
        question: { type: string }
        answer: { type: string }
      required: [id, question, answer]
    Question:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        question: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, question, status, createdAt]
    QuestionInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        question: { type: string, minLength: 1 }
      required: [name, email, question]
    StockReport:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/Medicine"
      required: [generatedAt, items]

